upstream bookmark_service {
    server bookmark_service1:8080;
    server bookmark_service2:8080;
    server bookmark_service3:8080;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://portal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bookmark_service/ {
        proxy_pass http://bookmark_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
